# Equivalent
exclude_re = [
    # (h << 4) has a zero low nibble and l < 16, so | and ^ build the same byte.
    'replace \| with \^ in percent_decode',
    # Re-entering the star branch with i = star_i reaches the same state as i = star_i + 1.
    'replace \+ with \* in glob_match',
    # Non-terminating: each stops the loop index from advancing past the input, so no
    # test can observe the mutant except as a timeout. 258:15 `-=` was confirmed by
    # the gate's 3x replay on PR #49; the other four ran past 40 s when applied by hand.
    'src/main\.rs:258:15: replace \+= with [-*]= in percent_decode',
    'src/main\.rs:262:11: replace \+= with [-*]= in percent_decode',
    'src/main\.rs:799:15: replace -= with /= in onefile_detect',
]
