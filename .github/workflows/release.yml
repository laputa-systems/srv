name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            docker_platform: ''
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker_platform: linux/amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            docker_platform: linux/arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: matrix.docker_platform != ''
      - name: Build Linux release image
        if: matrix.docker_platform != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.docker_platform }}
          load: true
          tags: srv-builder:${{ matrix.target }}
          cache-from: type=gha,scope=srv-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=srv-${{ matrix.target }}
      # rust-toolchain.toml selects the pinned nightly; rustup installs it, with rust-src, on the first cargo call.
      - name: Build macOS release
        if: matrix.docker_platform == ''
        run: make release TARGET="${{ matrix.target }}"
      - name: Run macOS tests
        if: matrix.docker_platform == ''
        run: make test-ci TARGET="${{ matrix.target }}"
      - name: Save macOS release
        if: matrix.docker_platform == ''
        run: cp "target/${{ matrix.target }}/release/srv" "srv-${{ matrix.target }}"
      - name: Build and verify Linux releases
        if: matrix.docker_platform != ''
        run: |
          docker run --rm --init \
            --platform "${{ matrix.docker_platform }}" \
            -v "$GITHUB_WORKSPACE:/srv" \
            -w /srv \
            srv-builder:${{ matrix.target }} \
            sh -ec '
              make release-dynamic TARGET=${{ matrix.target }}
              make verify-release-dynamic TARGET=${{ matrix.target }}
              make test-ci TARGET=${{ matrix.target }}
              cp target/${{ matrix.target }}/release/srv srv-${{ matrix.target }}
              make release TARGET=${{ matrix.target }}
              make verify-release TARGET=${{ matrix.target }}
              cp target/${{ matrix.target }}/release/srv srv-${{ matrix.target }}-static
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: srv-${{ matrix.target }}
          path: srv-*

  release:
    name: Create pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: srv-*
          path: dist
          merge-multiple: true
      - name: Zip artifacts
        run: for f in dist/*; do zip -9 --junk-paths "$f.zip" "$f"; done
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "$RELEASE_TAG"
